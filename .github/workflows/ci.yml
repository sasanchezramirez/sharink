name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12, PostgreSQL & Poetry)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sharink
          POSTGRES_PASSWORD: sharink
          POSTGRES_DB: sharink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://sharink:sharink@localhost:5432/sharink
      SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
      ENV: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.1.1"
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-3.12-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-3.12-

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --sync

      - name: Run Ruff Lint Check
        working-directory: backend
        run: poetry run ruff check .

      - name: Run Ruff Format Check
        working-directory: backend
        run: poetry run ruff format --check .

      - name: Apply Database Migrations
        working-directory: backend
        run: poetry run alembic upgrade head

      - name: Run Pytest Test Suite
        working-directory: backend
        run: poetry run pytest -v

  frontend:
    name: Frontend (Node 20, TypeScript & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Lint (tsc --noEmit)
        run: npm run lint

      - name: Production Build (vite build)
        run: npm run build
