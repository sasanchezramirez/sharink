services:
  db:
    image: postgres:16-alpine
    container_name: sharink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharink}
      POSTGRES_DB: ${POSTGRES_DB:-sharink}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sharink} -d ${POSTGRES_DB:-sharink}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
