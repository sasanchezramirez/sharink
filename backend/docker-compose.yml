services:
  db:
    image: postgres:16-alpine
    container_name: sharink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharink}
      POSTGRES_DB: ${POSTGRES_DB:-sharink}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sharink} -d ${POSTGRES_DB:-sharink}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharink-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sharink}:${POSTGRES_PASSWORD:-sharink}@db:5432/${POSTGRES_DB:-sharink}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-chars-long}
      ENV: ${ENV:-dev}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
