<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep space background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#151928" />
      <stop offset="70%" stop-color="#0b0d13" />
      <stop offset="100%" stop-color="#06070a" />
    </radialGradient>

    <!-- Glowing nebula accent -->
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0d13" stop-opacity="0" />
    </radialGradient>

    <!-- Electromagnetic spectral node gradients -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Filters for organic cosmic glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="url(#nebulaGlow)" />

  <!-- Orbital constellation rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 6" />

  <!-- Constellation Graph Connecting Edges -->
  <g stroke-linecap="round" opacity="0.6">
    <line x1="256" y1="256" x2="370" y2="175" stroke="#38bdf8" stroke-width="3" />
    <line x1="256" y1="256" x2="160" y2="160" stroke="#c084fc" stroke-width="2.5" />
    <line x1="256" y1="256" x2="175" y2="355" stroke="#34d399" stroke-width="3" />
    <line x1="256" y1="256" x2="350" y2="345" stroke="#fbbf24" stroke-width="2" />
    <line x1="160" y1="160" x2="370" y2="175" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="175" y1="355" x2="350" y2="345" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Node 1: North-East (Flow cyan node) -->
  <circle cx="370" cy="175" r="32" fill="url(#flowGrad)" filter="url(#glow)" />
  <circle cx="370" cy="175" r="12" fill="#ffffff" opacity="0.75" />

  <!-- Node 2: North-West (Inspiration purple node) -->
  <circle cx="160" cy="160" r="26" fill="url(#purpleGrad)" filter="url(#glow)" />
  <circle cx="160" cy="160" r="10" fill="#ffffff" opacity="0.75" />

  <!-- Node 3: South-West (Neutral vitality green node) -->
  <circle cx="175" cy="355" r="30" fill="url(#greenGrad)" filter="url(#glow)" />
  <circle cx="175" cy="355" r="11" fill="#ffffff" opacity="0.75" />

  <!-- Node 4: South-East (Active amber node) -->
  <circle cx="350" cy="345" r="22" fill="url(#amberGrad)" filter="url(#glow)" />
  <circle cx="350" cy="345" r="8" fill="#ffffff" opacity="0.75" />

  <!-- Central Supermassive Core (Sharink Origin) -->
  <circle cx="256" cy="256" r="48" fill="#0b0d13" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" />
  <circle cx="256" cy="256" r="36" fill="url(#flowGrad)" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
</svg>
